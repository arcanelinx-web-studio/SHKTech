name: SHK GitHub Pages preview

on:
  push:
    branches:
      - client-review-v4-hostinger-crm
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shk-pages-preview
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: 1
      SITE_URL: https://arcanelinx-web-studio.github.io
      BASE_PATH: /SHKTech
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: npm run check

      - name: Build project-site preview
        run: npm run build

      - name: Make root-relative links project-path safe
        run: node scripts/prepare-pages.mjs

      - name: Publish built site to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
